# Builds the site and deploys it to the woogidex Cloudflare Worker.
#
# The site is three repos:
#   woogidex-core     (public)  the Fakemon maker and battles; the app itself
#   woogidex-web      (this)    accounts, Community Hub, events and the rest
#   woogidex-backend  (private) the Worker (worker/index.js, wrangler.jsonc)
#                               and Supabase (migrations, edge functions)
#
# Every deploy takes the latest main of all three, so a change to any of them
# deploys the whole site. Core and backend ask for a deploy with a
# repository_dispatch (their notify-deploy.yml); a push here deploys directly.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    Workers Scripts: Edit on the account
#   CLOUDFLARE_ACCOUNT_ID   the account the woogidex Worker lives in
#   BACKEND_DEPLOY_KEY      read-only deploy key of woogidex-backend (SSH private key)
#   SUPABASE_ACCESS_TOKEN   optional: deploys the edge functions when backend changes
#
# Database migrations are NOT applied here: the database is live, and a bad
# migration is hard to undo. Apply them by hand (see woogidex-backend's README).

name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [core-updated, backend-updated]
  workflow_dispatch:
    inputs:
      functions:
        description: Also deploy the Supabase edge functions
        type: boolean
        default: false

# one deploy at a time, in order; a newer one waits for the running one
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out woogidex-web
        uses: actions/checkout@v5

      - name: Check out woogidex-core
        uses: actions/checkout@v5
        with:
          repository: woogi999/woogidex-core
          ref: main
          path: core

      - name: Check out woogidex-backend
        uses: actions/checkout@v5
        with:
          repository: woogi999/woogidex-backend
          ref: main
          path: .backend
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}

      - name: Show what is being deployed
        run: |
          {
            echo "### Deploying"
            echo "| repo | commit |"
            echo "|---|---|"
            echo "| woogidex-web | \`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s | head -c 80) |"
            echo "| woogidex-core | \`$(git -C core rev-parse --short HEAD)\` $(git -C core log -1 --format=%s | head -c 80) |"
            echo "| woogidex-backend | \`$(git -C .backend rev-parse --short HEAD)\` $(git -C .backend log -1 --format=%s | head -c 80) |"
            echo
            echo "Triggered by: ${{ github.event_name }} ${{ github.event.action }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy the Worker and the site
        working-directory: .backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf dist && cp -r ../dist dist
          npx --yes wrangler@4 deploy --message "web $(git -C .. rev-parse --short HEAD), core $(git -C ../core rev-parse --short HEAD), backend $(git rev-parse --short HEAD)"

      - name: Deploy the Supabase edge functions
        if: github.event.action == 'backend-updated' || inputs.functions
        working-directory: .backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the edge functions were not deployed."
            exit 0
          fi
          npx --yes supabase@2 functions deploy --project-ref qstbascfeolkyxtrqqwv
